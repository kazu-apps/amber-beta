<body><h1 style="font-size:1.2rem">Amber — FOREGROUND_SERVICE_DATA_SYNC の使い方</h1>
<video src="fgs-demo.mp4" controls playsinline></video>
<p>「サイト全体」を選んで保存を始めると、複数ページの取得がフォアグラウンド サービス（dataSync）で走ります。ユーザーがアプリを離れても取得は続き、進捗画面で一時停止・再開・中止ができます。取得は robots.txt に従い、間隔を空け、上限（ページ数・容量）で止まります。</p>
